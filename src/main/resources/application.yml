server:
  port: 8080
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: "https://fresh-cart-frontend-zeta.vercel.app"
                allowedMethods: "*"
                allowedHeaders: "*"
          routes:
            - id: product-service
              uri: lb://product-service
              predicates:
                - Path=/api/products/**
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/orders/**
          httpclient:
            connect-timeout: 10000
            read-timeout: 30000
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/