server:
  port: 8080
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: product-service
              uri: lb://product-service
              predicates:
                - Path=/api/products/**
              filters:
                - AddRequestHeader=Accept-Encoding, gzip
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/orders/**
              filters:
                - AddRequestHeader=Accept-Encoding, gzip
          httpclient:
            connect-timeout: 10000
            read-timeout: 30000
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/